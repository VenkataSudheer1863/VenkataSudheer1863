    {
        title: "𝗞𝗻𝗼𝘄𝗹𝗲𝗱𝗴𝗲 𝗚𝗿𝗮𝗽𝗵𝘀 are 𝗰𝗵𝗮𝗻𝗴ing 𝘁𝗵𝗲 𝗴𝗮𝗺𝗲.",
        img: "https://media.licdn.com/dms/image/v2/D5622AQEmHNxP15R9GQ/feedshare-shrink_800/B56Z8RtujUKEAc-/0/1782708627959?e=1785974400&v=beta&t=CcjZU82gGoVbkDwZwgl-JqgCKhIegWHZu8RDcvWMjk8",
        link: "https://www.linkedin.com/posts/venkata-sudheer-paruchuri-927b03248_knowledgegraphs-contextengineering-agenticai-activity-7477221934368206848-OcVS?utm_source=share&utm_medium=member_desktop&rcm=ACoAAD1jXW8B2X3fSM8Oqo7u26ma5V5ydpLekdg"
    },
    {
        title: "𝗧𝗵𝗲 𝗠𝗶𝘀𝘀𝗶𝗻𝗴 𝗟𝗮𝘆𝗲𝗿 𝗶𝗻 𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗔𝗜",
        img: "https://media.licdn.com/dms/image/v2/D5622AQHj-Qwn6XAEaA/feedshare-shrink_800/B56Z65yN10HIAc-/0/1781233409666?e=1785369600&v=beta&t=sI_2gl-RWQGq1gONv08Xd5RywB6wT6OKC6vcnPlFmkY",
        link: "https://www.linkedin.com/posts/venkata-sudheer-paruchuri-927b03248_contextintelligence-agenticai-contextengineering-activity-7471034422130036736-9cG7?utm_source=share&utm_medium=member_desktop&rcm=ACoAAD1jXW8B2X3fSM8Oqo7u26ma5V5ydpLekdg"
    },
        {
        title: "𝗔𝗜 𝗚𝗼𝘃𝗲𝗿𝗻𝗮𝗻𝗰𝗲 in 𝘁𝗵𝗲 𝗖𝗼𝗻𝘁𝗲𝘅𝘁 𝗘𝗻𝗴𝗶𝗻𝗲𝗲𝗿𝗶𝗻𝗴 𝗲𝗿𝗮.",

        link: "https://www.linkedin.com/posts/venkata-sudheer-paruchuri-927b03248_aigovernance-contextengineering-agenticai-activity-7475413569338195968-X1kQ?utm_source=share&utm_medium=member_desktop&rcm=ACoAAD1jXW8B2X3fSM8Oqo7u26ma5V5ydpLekdg"
    }
];

const container = document.getElementById("blog-cards");

function renderBlogs() {
    if (blogs.length === 0) {
        container.innerHTML = `<div class="loading">No posts yet. Check back soon.</div>`;
        return;
    }
    container.innerHTML = "";
    blogs.forEach((blog, idx) => {
        const card = document.createElement("div");
        card.className = "blog-card reveal";
        card.style.transitionDelay = `${idx * 0.1}s`;
        card.innerHTML = `
            <img
                src="${blog.img}"
                alt="${blog.title}"
                loading="lazy"
                onerror="this.onerror=null;this.src='PIC.jpg';"
            />
            <h3>${blog.title}</h3>
        `;
        card.addEventListener("click", () => {
            window.open(blog.link, "_blank");
        });
        container.appendChild(card);
    });

    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.06 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // 3D tilt
    document.querySelectorAll('.blog-card').forEach(card => {
        card.addEventListener('mousemove', e => {
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width  - 0.5;
            const y = (e.clientY - r.top)  / r.height - 0.5;
            card.style.transform = `perspective(700px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg) translateY(-5px)`;
        });
        card.addEventListener('mouseleave', () => { card.style.transform = ''; });
    });
}

document.addEventListener("DOMContentLoaded", renderBlogs);
</script>
